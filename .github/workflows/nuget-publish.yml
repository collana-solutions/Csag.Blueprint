name: NuGet Publish

on:
  release:
    types: [published]
  # Publishes an existing release again, for example after a failed push. A re-run of a release run uses the
  # workflow as it was at the release tag. A dispatch from main uses this file and checks out the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of the Domain package, for example @collana-solutions/csag-blueprint-domain@0.13.0
        required: true
        type: string

permissions: {}

# Runs are serialized and pushes use --skip-duplicate, so a second run for the same version pushes nothing.
concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to nuget.org
    # All seven packages are versioned in lockstep, so one version train produces seven GitHub Releases,
    # one per fixed package. Only the Domain package's release runs this job, and it packs and pushes all seven.
    if: startsWith(inputs.tag || github.event.release.tag_name, '@collana-solutions/csag-blueprint-domain@')
    runs-on: ubuntu-latest
    # nuget.org's trusted publishing policy for these packages names this environment, and the OIDC token
    # carries it, so only this job can obtain a push key.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # Tag format: @collana-solutions/csag-blueprint-domain@0.13.0
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"

      - name: Remove changesets version-tracking stubs
        run: |
          # Remove package.json files so they don't leak into the NuGet packages
          find packages/ -name "package.json" -delete

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build -o ./nupkgs

      # The version comes from the .csproj files, which scripts/sync-versions.mjs sets in the version PR, so
      # this fails when the tag and the projects disagree.
      - name: Verify packed version matches the release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls ./nupkgs
          test -f "./nupkgs/Csag.Blueprint.Domain.${VERSION}.nupkg"

      # The key nuget.org returns is valid for one hour, so it is requested only once the packages are built.
      # NUGET_USER is the nuget.org profile name of the member of collana-solutions who owns the policy.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Each .snupkg next to its .nupkg goes to the nuget.org symbol server with the same key.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
